name: Refresh pools coupon

on:
  schedule:
    - cron: "30 5 * * *"   # daily 05:30 UTC (06:30 WAT) - fresh coupon before match day, grading after
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh coupon.json from the real sources
        run: python pools/refresh_coupon.py
      - name: Commit if changed
        run: |
          git config user.name "jap-coupon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pools/coupon.json
          if git diff --cached --quiet; then
            echo "coupon unchanged"
          else
            git commit -m "coupon: auto refresh $(date -u +%F)"
            git push
          fi
